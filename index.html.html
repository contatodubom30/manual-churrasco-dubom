<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual da Marca : Churrasco du Bom</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --carvao:     #1A1A1A;
    --bordo:      #7B1C1C;
    --dourado:    #C49A3C;
    --branco:     #FFFFFF;
    --bege:       #EDE8DF;
    --cinza-txt:  #555555;
    --cinza-claro:#AAAAAA;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #111111;
    color: var(--carvao);
    padding: 40px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── SLIDE BASE (Mantendo a proporção exata do seu arquivo original) ── */
  .slide {
    width: 1456px;
    min-height: 816px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: var(--branco);
    margin-bottom: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }

  /* ── ESTILOS E GRIDS DO BRIEFING ── */
  .slide-content { padding: 80px 100px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; }
  
  /* ── CORES DOS SLIDES ── */
  .s-cover { background: var(--carvao); color: var(--branco); }
  .s-dark { background: var(--bordo); color: var(--branco); }
  .s-light { background: var(--bege); color: var(--carvao); }
  .s-section { background: var(--dourado); color: var(--carvao); text-align: center; }
  
  /* ── TIPOGRAFIA OFICIAL ── */
  h1, h2, h3, .font-title, .slide-number, .section-title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }
  h1 { font-size: 5.5rem; line-height: 1; color: var(--branco); text-transform: uppercase; }
  h1 span { color: var(--dourado); }
  h2 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 30px; color: var(--bordo); text-transform: uppercase; }
  .s-dark h2 { color: var(--dourado); }
  .s-section h2 { font-size: 6rem; color: var(--carvao); margin-bottom: 0; }
  
  p { font-size: 1.25rem; line-height: 1.7; color: var(--cinza-txt); margin-bottom: 20px; }
  .s-dark p { color: var(--bege); }
  
  .slide-number { position: absolute; bottom: 40px; right: 50px; font-size: 1.5rem; color: var(--cinza-claro); }
  .s-dark .slide-number { color: rgba(255,255,255,0.2); }
  
  /* ── BRANDING & LOGO VETORIAL COMPLETO ── */
  .logo-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo-svg-wrap { display: block; margin-bottom: 20px; }
  
  .cover-layout { display: grid; grid-template-columns: 350px 1fr; height: 100%; width: 100%; }
  .cover-sidebar { background: var(--dourado); display: flex; align-items: center; justify-content: center; }
  .cover-main { padding: 100px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .cover-slogan { font-size: 2rem; color: var(--dourado); font-family: 'Bebas Neue', sans-serif; margin-top: 20px; letter-spacing: 3px; }

  .pilar { margin-bottom: 30px; }
